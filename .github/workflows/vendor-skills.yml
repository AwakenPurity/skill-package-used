name: Copy pinned skill sources
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vendor-skills.yml'
permissions:
  contents: write
concurrency:
  group: vendor-skills-once
  cancel-in-progress: false
jobs:
  copy-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false
      - name: Copy and verify complete upstream files
        run: python .github/vendor_import.py
      - name: Commit actual files and remove import machinery
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Vendor complete skill sources and remove submodules"
          git push origin HEAD:main
